<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetTimeOut Function | Chai aur JavaScript</title>
    <style>
        body{
            background-color: black;
            color: whitesmoke
        }
    </style>
</head>
<body>
    <h2>Chai Aur Code</h2>
    <button id="stop">Stop</button>

    <script>

        setTimeout( () => {
            console.log("Hello WOrld!!!");
        },2000)

        let changetittle = function(){
            document.querySelector('h2').innerHTML = "Namaste JavaScript";
        }

        let clearme = setTimeout(changetittle, 2000);

        document.querySelector('#stop').addEventListener('click', () => {
            clearTimeout(clearme);
            console.log('STOPED');
        })

    </script>
</body>
</html>
